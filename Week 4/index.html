<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Week 4 - Generative Art</title>


  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: radial-gradient(circle at center, #2a1d38 0%, #120d1d 48%, #09060d 100%);
    }

    canvas {
      display: block;
      width: 800px;
      max-width: calc(100vw - 32px);
      max-height: calc(100vh - 32px);
      height: auto;
      border: 1px solid rgba(201, 160, 255, 0.35);
      box-shadow: 0 0 28px rgba(162, 107, 255, 0.18), 0 18px 64px rgba(0, 0, 0, 0.65);
    }
  </style>

  <script src="../libraries/p5.min.js"></script>
  <script src="../libraries/p5.sound.min.js"></script>
</head>

<body>
  <script src="sketch.js"></script>
</body>

</html>
